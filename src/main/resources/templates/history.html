<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account History</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="topbar">
            <h1>Account History</h1>
            <p><a th:href="@{/}" class="back-link">&larr; Back to Dashboard</a></p>
        </header>

        <div class="card full-width">
            <h2 th:text="${'Account: ' + customer.accountNumber + ' - ' + customer.fullName}">Account Details</h2>
            <p><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
            <p><strong>Current Balance:</strong> LKR <span th:text="${#numbers.formatDecimal(customer.balance, 1, 'COMMA', 2, 'POINT')}"></span></p>
        </div>

        <div class="card full-width">
            <h2>Transaction History</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Description</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${history}">
                        <td th:text="${tx.id}"></td>
                        <td th:text="${tx.fromAccount}"></td>
                        <td th:text="${tx.toAccount}"></td>
                        <td th:text="${#numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span th:class="${tx.status != null and tx.status.name() == 'SUCCESS' ? 'badge success' : 'badge failed'}" th:text="${tx.status}"></span>
                        </td>
                        <td th:text="${tx.description}"></td>
                        <td th:text="${tx.createdAt != null ? #temporals.format(tx.createdAt, 'yyyy-MM-dd HH:mm:ss') : ''}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(history)}">
                        <td colspan="7" style="text-align:center; color: #94a3b8;">No transaction history for this account.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
