<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Withdraw Money</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Withdraw Money</h1>
    <p>Bank Transfer System &middot; Spring Boot &middot; MySQL</p>
</header>

<main class="container">

    <nav class="card navigation">
        <a th:href="@{/}" class="btn small">Dashboard</a>
        <a th:href="@{/deposit}" class="btn small">Deposit Money</a>
        <a th:href="@{/large-transfers(min=10000)}" class="btn small">
            Large Transfers
        </a>
    </nav>

    <div class="alert success"
         th:if="${success}"
         th:text="${success}"></div>

    <div class="alert danger"
         th:if="${error}"
         th:text="${error}"></div>

    <section class="card">
        <h2>Withdraw Funds</h2>

        <form th:action="@{/withdraw}" method="post">
            <div class="field">
                <label for="accountNumber">Customer Account</label>
                <select id="accountNumber" name="accountNumber" required>
                    <option value="">-- Select account --</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.accountNumber}"
                            th:text="${c.fullName + ' (' + c.accountNumber + ')'}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label for="amount">Amount (LKR)</label>
                <input type="number"
                       id="amount"
                       name="amount"
                       min="0.01"
                       step="0.01"
                       placeholder="2000.00"
                       required>
            </div>

            <button type="submit" class="btn primary">
                Withdraw Money
            </button>
        </form>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 06
</footer>

</body>
</html>
